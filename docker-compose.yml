services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - TRUST_PROXY=1
      - DATA_DIR=/data
      - TEACHER_CODE=${TEACHER_CODE:-}
    volumes:
      - ./data:/data        # nilai & jawaban tersimpan di folder data/ (jangan dihapus)
  caddy:                    # pintu masuk HTTPS otomatis (sertifikat gratis Let's Encrypt)
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80","443:443"]
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
